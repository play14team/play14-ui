name: Deploy to Azure Container Apps (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aca-production
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  STRAPI_API_URL: "https://community.play14.org"
  REGISTRY: play14containerregistry.azurecr.io
  IMAGE_NAME: play14/play14-ui
  CONTAINER_APP_NAME: play14-ui
  RESOURCE_GROUP: play14-community
  CONTAINER_APP_ENVIRONMENT: play14-container-env

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

  build-and-deploy:
    name: Build and Deploy
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name play14containerregistry

      - name: Generate image tag
        id: image-tag
        run: |
          TAG="prod-${{ github.sha }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full-image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT
          echo "latest-image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image-tag.outputs.full-image }}
            ${{ steps.image-tag.outputs.latest-image }}
          build-args: |
            STRAPI_API_URL=${{ env.STRAPI_API_URL }}
            STRAPI_API_SECRET=${{ secrets.STRAPI_API_SECRET }}
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ steps.image-tag.outputs.full-image }} \
            --set-env-vars \
              STRAPI_API_URL=${{ env.STRAPI_API_URL }} \
              STRAPI_API_SECRET=secretref:strapi-api-secret \
              NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=secretref:mapbox-token

      - name: Get Container App URL
        id: get-url
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "url=https://${URL}" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          URL="${{ steps.get-url.outputs.url }}"
          for i in {1..10}; do
            if curl -f -s "${URL}/api/health" > /dev/null; then
              echo "✅ Health check passed!"
              echo "🚀 Production deployment successful: ${URL}"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 10 attempts"
          exit 1

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.image-tag.outputs.full-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${{ env.STRAPI_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
