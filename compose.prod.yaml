services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        STRAPI_API_URL: ${STRAPI_API_URL}
        STRAPI_API_SECRET: ${STRAPI_API_SECRET}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
        NEXT_PUBLIC_WEB_VITALS: ${NEXT_PUBLIC_WEB_VITALS:-false}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - STRAPI_API_URL=${STRAPI_API_URL}
      - STRAPI_API_SECRET=${STRAPI_API_SECRET}
      - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
      - NEXT_PUBLIC_WEB_VITALS=${NEXT_PUBLIC_WEB_VITALS:-false}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
