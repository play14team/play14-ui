services:
  app:
    container_name: play14-ui
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:z
      - ./public:/app/public:z
      - ./next.config.js:/app/next.config.js:z
      - ./tsconfig.json:/app/tsconfig.json:z
      - ./.prettierrc:/app/.prettierrc:z
      - ./eslint.config.mjs:/app/eslint.config.mjs:z
      # Preserve node_modules in container
      - node_modules:/app/node_modules
    environment:
      # All environment variables are loaded from .env.local
      # Override specific values here if needed
      - NODE_ENV=development
      # Override STRAPI_API_URL to use the service name from play14-api network
      - STRAPI_API_URL=http://play14-api:1337
    command: pnpm develop
    networks:
      - Play14-api
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  node_modules:

networks:
  Play14-api:
    external: true
