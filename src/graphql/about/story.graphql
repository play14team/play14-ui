query Story {
  history {
    founders
    keyMoments
    intro
    items {
      id
      date
      dateFormat
      additionalText
      title
      description
      image {
        name
        url
      }
    }
  }
  players(sort: "name:asc", filters: { position: { eq: "Founder" } }) {
    ...PlayerItem
  }
}
