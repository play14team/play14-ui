query ArticleSidebar {
  latest: articles_connection(
    sort: "publishedAt:desc"
    pagination: { limit: 3 }
  ) {
    nodes {
      documentId
      slug
      title
      publishedAt
      defaultImage {
        name
        url
        width
        height
      }
    }
  }
  categories: articles {
    category
  }
  tags: articles {
    tags {
      value
    }
  }
}
