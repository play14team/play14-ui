query Markers {
  events(
    sort: "start:asc"
    filters: { status: { ne: "Cancelled" }, venue: { location: { ne: {} } } }
    pagination: { limit: 5000 }
  ) {
    documentId
    slug
    name
    start
    end
    timezone
    status
    registration {
      link
    }
    venue {
      name
      website
      location
    }
  }
}
