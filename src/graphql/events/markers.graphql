query Markers {
  events(
    sort: "start:asc"
    filters: {
      eventStatus: { ne: "Cancelled" }
      venue: { location: { ne: {} } }
    }
    pagination: { limit: 5000 }
  ) {
    documentId
    slug
    name
    start
    end
    timezone
    eventStatus
    registration {
      link
    }
    venue {
      name
      website
      location
    }
  }
}
