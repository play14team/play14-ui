query Player($slug: String!) {
  players(filters: { slug: { eq: $slug } }) {
    ...PlayerDetails
  }
}

fragment PlayerDetails on Player {
  documentId
  slug
  name
  position
  company
  tagline
  bio
  website
  location
  avatar {
    name
    url
    width
    height
  }
  socialNetworks {
    id
    url
    type
  }
  attended(sort: "start:desc") {
    ...EventItem
  }
  hosted(sort: "start:desc") {
    ...EventItem
  }
  mentored(sort: "start:desc") {
    ...EventItem
  }
}
