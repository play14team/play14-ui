query Search($input: String!) {
  search(query: $input) {
    events {
      nodes {
        documentId
        slug
        name
        start
        end
        timezone
        eventStatus
        publishedAt
        defaultImage {
          name
          url
          width
          height
        }
        location {
          name
          country
        }
      }
    }
    articles {
      nodes {
        documentId
        slug
        title
        summary
        category
        publishedAt
        defaultImage {
          name
          url
          width
          height
        }
        author {
          slug
          name
          avatar {
            name
            url
            width
            height
          }
        }
      }
    }
    games {
      nodes {
        documentId
        slug
        name
        summary
        timebox
        scale
        category
        publishedAt
        proposedBy {
          name
          slug
          avatar {
            name
            url
            width
            height
          }
        }
        defaultImage {
          name
          url
          width
          height
        }
      }
    }
    players {
      nodes {
        documentId
        slug
        name
        position
        publishedAt
        avatar {
          name
          url
          width
          height
        }
      }
    }
  }
}
